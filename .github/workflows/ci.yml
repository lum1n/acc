name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Drives real multiplexers with the commands acc-core builds.
  multiplexers:
    runs-on: ubuntu-latest
    env:
      ACC_REQUIRE_MUX: "1"
      ZELLIJ_VERSION: 0.45.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux, screen and zellij
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux screen
          curl -fsSL "https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin zellij
          tmux -V; screen -v || true; zellij --version
      - run: cargo test -p acc-core --test multiplexers

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p acc-ffi --release --target aarch64-apple-ios
      - run: cargo build -p acc-ffi --release --target aarch64-apple-ios-sim
      - name: Generate Swift bindings
        run: |
          cargo build -p acc-ffi --release
          cargo run -p acc-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libacc_ffi.dylib --language swift --out-dir bindings/swift
      - name: Type-check Swift bindings
        run: |
          cd bindings/swift
          swiftc -parse-as-library -typecheck -I . \
            -Xcc -fmodule-map-file=acc_ffiFFI.modulemap acc_ffi.swift
      - name: Swift smoke test (recorded Claude session through the library)
        run: |
          swiftc crates/acc-ffi/tests/smoke.swift bindings/swift/acc_ffi.swift -I bindings/swift \
            -Xcc -fmodule-map-file=bindings/swift/acc_ffiFFI.modulemap \
            -L target/release -lacc_ffi -o target/swift-smoke
          DYLD_LIBRARY_PATH=target/release target/swift-smoke "$PWD"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build Android libraries
        # ANDROID_NDK_LATEST_HOME is a runner environment variable, not part of the
        # workflow `env` context, so it has to be read from the shell.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o jniLibs build -p acc-ffi --release
      - name: Generate Kotlin bindings
        run: |
          cargo build -p acc-ffi --release
          cargo run -p acc-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libacc_ffi.so --language kotlin --no-format --out-dir bindings/kotlin
      - name: Kotlin smoke test (JVM, same bindings as Android)
        run: |
          curl -fsSL -o jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar
          kotlinc crates/acc-ffi/tests/smoke.kt bindings/kotlin/uniffi/acc_ffi/acc_ffi.kt \
            -cp jna.jar -include-runtime -d target/kotlin-smoke.jar
          java -Djna.library.path=target/release -cp target/kotlin-smoke.jar:jna.jar SmokeKt "$PWD"
      - name: Python smoke test (exercises every FFI call)
        run: |
          cargo run -p acc-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libacc_ffi.so --language python --out-dir bindings/python
          cp target/release/libacc_ffi.so bindings/python/
          python3 crates/acc-ffi/tests/smoke.py bindings/python

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p acc-wasm --release --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          # Must match the wasm-bindgen version in Cargo.lock.
          tool: wasm-bindgen@0.2.129
      - name: Node smoke test (recorded Claude session through wasm)
        run: |
          wasm-bindgen --target nodejs --out-dir bindings/node \
            target/wasm32-unknown-unknown/release/acc_wasm.wasm
          node crates/acc-wasm/tests/smoke.mjs bindings/node
      - name: Core must not depend on host-only code
        run: cargo build -p acc-core --target wasm32-unknown-unknown
