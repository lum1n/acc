name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p acc-ffi --release --target aarch64-apple-ios
      - run: cargo build -p acc-ffi --release --target aarch64-apple-ios-sim
      - name: Generate Swift bindings
        run: |
          cargo build -p acc-ffi --release
          cargo run -p acc-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libacc_ffi.dylib --language swift --out-dir bindings/swift
      - name: Type-check Swift bindings
        run: |
          cd bindings/swift
          swiftc -parse-as-library -typecheck -I . \
            -Xcc -fmodule-map-file=acc_ffiFFI.modulemap acc_ffi.swift

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build Android libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk -t arm64-v8a -t x86_64 -o jniLibs build -p acc-ffi --release
      - name: Generate Kotlin bindings
        run: |
          cargo build -p acc-ffi --release
          cargo run -p acc-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libacc_ffi.so --language kotlin --no-format --out-dir bindings/kotlin

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p acc-wasm --release --target wasm32-unknown-unknown
      - name: Core must not depend on host-only code
        run: cargo build -p acc-core --target wasm32-unknown-unknown
