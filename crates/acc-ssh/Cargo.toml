[package]
name = "acc-ssh"
description = "Daemonless SSH transport for acc-core: drive harnesses on a host over plain SSH"
version.workspace = true
edition.workspace = true
# russh needs 1.89.
rust-version = "1.89"
publish.workspace = true

[dependencies]
acc-core.workspace = true
# Pure-Rust SSH; ring instead of the default aws-lc-rs so iOS and Android
# builds need no CMake or extra C toolchain.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
