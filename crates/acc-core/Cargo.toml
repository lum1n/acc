[package]
name = "acc-core"
description = "Agent Control Core: sans-IO model, protocol parsers and harness drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["drivers"]
# The protocol drivers and everything that reads what a harness says
# (sessions, policy, handoff, usage). Off, only the host side is built:
# harness catalogue, detached-session scripts, sandboxing, worktrees, watch.
# For embedders that provision workspaces but never drive an agent.
# Skills and MCP servers live in `acc-loadout`.
drivers = []
# Enables code that spawns local processes. Off for wasm32 and mobile clients.
host = []

[[example]]
name = "drive"
required-features = ["drivers"]

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true

[lints]
workspace = true
