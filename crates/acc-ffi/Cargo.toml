[package]
name = "acc-ffi"
description = "UniFFI bindings (Swift, Kotlin) for acc-core and the acc-ssh transport"
version.workspace = true
edition.workspace = true
# acc-ssh (russh) needs 1.89.
rust-version = "1.89"
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "acc_ffi"

[[bin]]
# Generates Swift/Kotlin sources: `cargo run -p acc-ffi --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
acc-core.workspace = true
acc-ssh.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `tokio`: async exports run on a tokio runtime the library starts itself.
uniffi = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
