[workspace]
resolver = "3"
members = ["crates/acc-core", "crates/acc-ffi", "crates/acc-wasm", "crates/acc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/lum1n/acc"
publish = false

[workspace.dependencies]
acc-core = { path = "crates/acc-core" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"
uniffi = "0.32"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind" # UniFFI catches panics at the FFI boundary; keep unwinding on.
